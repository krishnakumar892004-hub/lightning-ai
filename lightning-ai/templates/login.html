<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lightning AI — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

  <div class="storm-bg">
    <div class="storm-cloud c1"></div>
    <div class="storm-cloud c2"></div>
    <div class="storm-cloud c3"></div>
  </div>

  <main class="login-wrap">
    <div class="login-card">
      <div class="bolt-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="bolt-svg">
          <path d="M26 2 L8 28 H21 L18 46 L40 18 H27 Z"/>
        </svg>
      </div>

      <h1 class="login-title">Lightning AI</h1>
      <p class="login-sub">Ask anything. Create images. Understand images.<br>All in one strike.</p>

      <a href="{{ url_for('login_google') }}" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.4 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14-4.9l-6.5-5.5C29.4 35.5 26.8 36 24 36c-5.3 0-9.8-3.3-11.4-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.5-2.7 4.6-5 6l6.5 5.5C40.9 36.7 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Continue with Google
      </a>

      <p class="login-footnote">By continuing you agree your questions &amp; images may be stored to power your chat history.</p>
    </div>
  </main>

</body>
</html>
